name: Deploy static site to live server

# aura.skin is a static Vite/React SPA. On every push to main we build on the
# runner and rsync the dist/ output to nginx's docroot on the live server.
# nginx serves the files directly — no PM2 process, no reload needed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist/ via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --delete is safe here: /var/www/auraskin holds ONLY build output
          # (no runtime data, no uploads). It prunes stale hashed assets so the
          # docroot never grows unbounded across deploys.
          switches: -avz --delete
          path: dist/
          remote_path: /var/www/auraskin/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USERNAME }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
