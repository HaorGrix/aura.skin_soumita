# Self-hosted Supabase API (REST, auth, storage, edge functions), same origin as
# the site. The gateway listens on 127.0.0.1:8000 only; this is its sole public path.
location ~ ^/(rest|auth|storage|functions)/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 32m;
    proxy_read_timeout 60s;
    proxy_buffering on;
    # PostgREST echoes long in.() filters back in response headers (Content-Location);
    # the 4k default overflows on the product grid variant lookup (502).
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;
}
