# skintheorybd.shop: nginx site on hg-server-01 (/etc/nginx/sites-available/).
# Serves the built SPA and proxies the self-hosted Supabase API on the same
# origin. www is canonical; the apex redirects. Certbot adds the 443
# listeners, certificate paths and the port-80 redirect servers to the live
# copy of this file; they are left out here.

server {
    server_name skintheorybd.shop;
    return 308 https://www.skintheorybd.shop$request_uri;
}

server {
    server_name www.skintheorybd.shop;

    root /var/www/skintheorybd/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    include /etc/nginx/snippets/skintheorybd-headers.conf;

    include /etc/nginx/snippets/skintheorybd-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/skintheorybd-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/skintheorybd-headers.conf;
    }
}
