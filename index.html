<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2e9" />

    <!-- SEO -->
    <title>The Theory Behind Timeless Skin</title>
    <meta
      name="description"
      content="Skin Theory is a soulful, clean skincare ritual. Organic, cruelty-free formulas crafted to help your skin — and your spirit — radiate from within."
    />
    <meta name="keywords" content="skincare, clean beauty, organic, rituals, glow, self-care, skin theory" />
    <meta property="og:title" content="The Theory Behind Timeless Skin" />
    <meta
      property="og:description"
      content="A daily ritual for radiant skin and inner peace. Clean, organic, cruelty-free."
    />
    <meta property="og:type" content="website" />

    <!-- Fonts (client typography spec):
           Cormorant Garamond 600 — H1/H2, page titles, section headings
           Montserrat 500/600    — H3/product titles, buttons, nav/menu
           Inter 400/600         — body text (400) + price (600)
         Instrument Serif is no longer referenced but stays loaded — it's
         still the font baked into the header/footer wordmark artwork and
         a couple of legacy CMS defaults; safe to drop once those are gone.

         Noto Sans Bengali covers admin-entered Bangla content (product
         name/subtitle/description/philosophy/how-to-use, etc.) — none of
         the Latin fonts above have Bengali glyphs, so without this the
         browser falls back to whatever Bengali font happens to be
         installed locally (or renders tofu boxes on systems with none).
         Listed as a fallback in every --font-* stack in index.css, so
         Bangla text picks it up automatically wherever it's typed,
         mixed in with Latin text or on its own. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
